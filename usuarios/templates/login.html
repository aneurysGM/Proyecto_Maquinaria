<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Proyecto Alquiler</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100 justify-content-center align-items-center">

    <div class="card shadow-sm p-4 w-100" style="max-width: 420px;">
        
        <div class="text-center mb-4">
            <h2 class="h4 text-primary fw-bold">Sistema de alquiler de equipos</h2>
            <h1 class="h5 text-secondary">Iniciar sesión</h1>
        </div>

        <!-- Mensaje para un intento de acceso incorrecto. -->
        {% if form.errors %}
            <div class="alert alert-danger alert-dismissible fade show py-2 small" role="alert">
                Usuario o contraseña incorrectos. Inténtalo de nuevo.
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% endif %}

        <!-- POST envía las credenciales sin colocarlas en la URL. -->
        <form method="post">
            <!-- Protección de Django contra solicitudes falsificadas. -->
            {% csrf_token %}

            <div class="mb-3">
                <label for="{{ form.username.id_for_label }}" class="form-label fw-semibold small">Usuario</label>
                <!-- Aplicamos la clase form-control de Bootstrap -->
                {{ form.username }}
                <div class="text-danger small mt-1">{{ form.username.errors }}</div>
            </div>

            <div class="mb-3">
                <label for="{{ form.password.id_for_label }}" class="form-label fw-semibold small">Contraseña</label>
                <div class="input-group">
                    {{ form.password }}
                    <!-- Botón del ojo con clases de Bootstrap para que encaje como input-group -->
                    <button 
                        class="btn btn-outline-secondary" 
                        type="button" 
                        id="mostrar-clave"
                        aria-label="Mostrar contraseña"
                        aria-pressed="false"
                        aria-controls="id_password"
                        title="Mostrar contraseña"
                    >👁</button>
                </div>
                <div class="text-danger small mt-1">{{ form.password.errors }}</div>
            </div>

            <!-- Oculto hasta detectar Bloq Mayús activo. -->
            <div id="aviso-mayusculas" class="alert alert-warning py-1 px-2 small mb-3" role="status" hidden>
                ⚠️ Bloq Mayús está activado.
            </div>

            <div class="d-grid mt-4">
                <button type="submit" class="btn btn-primary">Entrar</button>
            </div>
        </form>

        <div class="text-center mt-3">
            <a href="{% url 'index' %}" class="text-decoration-none text-muted small">&larr; Volver al inicio</a>
        </div>
    </div>

    <!-- Script original de tu compañero para el manejo del ojo y Bloq Mayús -->
    <script>
        // Localiza los elementos que vamos a controlar.
        const campoClave = document.getElementById('id_password');
        const botonOjo = document.getElementById('mostrar-clave');
        const avisoMayusculas = document.getElementById('aviso-mayusculas');

        // Aseguramos que Django agregue la clase form-control por JS si no la tiene en el backend
        if (campoClave) campoClave.classList.add('form-control');
        const campoUser = document.getElementById('id_username');
        if (campoUser) campoUser.classList.add('form-control');

        // Un clic muestra la contraseña; otro vuelve a ocultarla.
        botonOjo.addEventListener('click', function () {
            const mostrar = campoClave.type === 'password';
            campoClave.type = mostrar ? 'text' : 'password';

            const descripcion = mostrar
                ? 'Ocultar contraseña'
                : 'Mostrar contraseña';

            botonOjo.setAttribute('aria-label', descripcion);
            botonOjo.setAttribute('aria-pressed', String(mostrar));
            botonOjo.title = descripcion;
        });

        // Comprueba Bloq Mayús cuando se pulsa una tecla en el campo.
        function comprobarMayusculas(evento) {
            avisoMayusculas.hidden = !evento.getModifierState('CapsLock');
        }

        campoClave.addEventListener('keydown', comprobarMayusculas);
        campoClave.addEventListener('keyup', comprobarMayusculas);

        // Oculta el aviso cuando dejamos el campo de contraseña.
        campoClave.addEventListener('blur', function () {
            avisoMayusculas.hidden = true;
        });
    </script>
    
    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
